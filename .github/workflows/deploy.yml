# Tests, then deploys the Docker Compose stack to a server over SSH.
# Server setup and the secrets this needs: docs/deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one half done.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        run: |
          pip install uv==0.13.0
          uv sync --frozen
          uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and type check
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    # Skipped until a server is configured (docs/deploy.md), so pushes to main stay green meanwhile.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repo settings to approve each deploy by hand.
    environment: production
    env:
      SSH_HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ific-guard' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" \
            || { echo "::error::Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (docs/deploy.md)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host keys, not ssh-keyscan: a deploy must not trust whatever answers on that address.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Copy the code
        # The server's .env, data volumes and downloaded issues are never touched: excluded files aren't deleted.
        run: |
          ssh target "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude .git/ --exclude .env --exclude data/shared/ --exclude 'frontend/node_modules/' \
            --exclude .scratch/ --exclude outputs/ \
            ./ "target:$DEPLOY_PATH/"
          ssh target "printf '%s\n' '${{ github.sha }}' > '$DEPLOY_PATH/DEPLOYED_COMMIT'"

      - name: Build and start
        run: |
          ssh target "set -e; cd '$DEPLOY_PATH'
            test -f .env || { echo '::error::$DEPLOY_PATH/.env is missing (docs/deploy.md)'; exit 1; }
            docker compose -p ific-guard up -d --build --remove-orphans
            docker image prune -f >/dev/null"

      - name: Check the services answer
        run: |
          ssh target 'for i in $(seq 1 24); do
              if curl -fsS -o /dev/null localhost:8001/issues && curl -fsS -o /dev/null localhost:8002/openapi.json \
                 && curl -fsS -o /dev/null localhost:8003/openapi.json; then echo "All three services answer."; exit 0; fi
              sleep 5
            done
            echo "::error::A service did not answer within 2 minutes"
            cd "'"$DEPLOY_PATH"'" && docker compose -p ific-guard ps && docker compose -p ific-guard logs --tail 50
            exit 1'

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
